[build]
  publish = "."
  command = "node scripts/build.mjs"

[build.environment]
  NODE_VERSION = "22"

# Bild-CDN: Firebase-Storage-Bilder duerfen ueber /.netlify/images verkleinert
# und als WebP/AVIF ausgeliefert werden (der Generator schreibt diese Adressen).
[images]
  remote_images = ['https://firebasestorage\.googleapis\.com/.*']
  # Inhaltsquelle: Verwaltung (Firebase Realtime Database, öffentlich lesbarer
  # content-Knoten). Ist die API nicht erreichbar, fällt der Build auf den im
  # Repo eingecheckten Stand content/site.json zurück.
  CONTENT_API_URL = "https://jupidu-36804-default-rtdb.europe-west1.firebasedatabase.app/samsparking/content.json"

[[headers]]
  for = "/*"
  [headers.values]
    # Kein X-Frame-Options: das kennt nur DENY/SAMEORIGIN und koennte die
    # Vorschau in der Verwaltung nicht erlauben. frame-ancestors ist der
    # Nachfolger und laesst gezielt nur die eigene Verwaltung (Netlify) zu —
    # fuer alle anderen Seiten bleibt das Einbetten verboten (Clickjacking).
    Content-Security-Policy = "frame-ancestors 'self' https://*.netlify.app https://*.netlify.com http://localhost:* http://127.0.0.1:*"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# CSS/JS werden bei Änderungen überschrieben (gleicher Dateiname) — daher kein
# langes Caching, sonst hängt eine alte Version im Browser/CDN.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Schriften aendern sich nie — ein Jahr cachen.
[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/media/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/presskit/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# ===========================================================================
# WARTUNG — abgeschaltet, die Website ist online.
#
# WIEDER AUF "COMING SOON" STELLEN: die naechsten vier Zeilen einkommentieren.
# Netlify nimmt die erste passende Regel, diese faengt damit alles ab — auch
# /de/, /fr/ und die Dateien unter /assets/. Status 503 (nicht 404) sorgt
# dafuer, dass Suchmaschinen die Seite im Index behalten und wiederkommen.
#
# ACHTUNG, falls wieder eingeschaltet wird: /robots.txt und /sitemap.xml
# muessen als Ausnahmen DAVOR stehen (Beispiel unten auskommentiert). Eine
# robots.txt, die laenger 5xx liefert, wertet Google als "alles gesperrt" —
# die Wartung wuerde dann Sichtbarkeit kosten statt sie nur zu pausieren.
#
# [[redirects]]
#   from = "/robots.txt"
#   to = "/robots.txt"
#   status = 200
# [[redirects]]
#   from = "/sitemap.xml"
#   to = "/sitemap.xml"
#   status = 200
#
# [[redirects]]
#   from = "/*"
#   to = "/coming-soon.html"
#   status = 503
#   force = true
#
# [[headers]]
#   for = "/*"
#   [headers.values]
#     Retry-After = "86400"
# ===========================================================================

# Quelldateien des Generators nicht ausliefern.
[[redirects]]
  from = "/scripts/*"
  to = "/404.html"
  status = 404

# Die Datei hiess frueher "sparkling" (Schreibfehler im Namen) — alte Links
# auf den richtig geschriebenen Namen weiterleiten.
[[redirects]]
  from = "/presskit/sam-sparkling-presskit-2026.pdf"
  to = "/presskit/sam-sparking-presskit-2026.pdf"
  status = 301

# Der Inhalts-Schnappschuss ist eine Bau-Zutat, keine Seite.
[[redirects]]
  from = "/content/*"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301

# Hauptsprache ist neu Englisch: fruehere deutsche Adressen zeigen auf /de/,
# die alten /en/-Adressen auf die Startseite.
[[redirects]]
  from = "/en/*"
  to = "/:splat"
  status = 301
[[redirects]]
  from = "/rechtliches/*"
  to = "/de/rechtliches/"
  status = 301
[[redirects]]
  from = "/fr/rechtliches/*"
  to = "/fr/mentions-legales/"
  status = 301

# Die Website ist ein Einseiter — fruehere Unterseiten-Adressen auf die Anker umlenken.
[[redirects]]
  from = "/shows/*"
  to = "/#shows"
  status = 301
[[redirects]]
  from = "/gallery/*"
  to = "/#gallery"
  status = 301
[[redirects]]
  from = "/booking/*"
  to = "/#booking"
  status = 301
[[redirects]]
  from = "/en/shows/*"
  to = "/en/#shows"
  status = 301
[[redirects]]
  from = "/en/gallery/*"
  to = "/en/#gallery"
  status = 301
[[redirects]]
  from = "/en/booking/*"
  to = "/en/#booking"
  status = 301
[[redirects]]
  from = "/fr/shows/*"
  to = "/fr/#shows"
  status = 301
[[redirects]]
  from = "/fr/gallery/*"
  to = "/fr/#gallery"
  status = 301
[[redirects]]
  from = "/fr/booking/*"
  to = "/fr/#booking"
  status = 301

# Ohne www und mit www duerfen nicht beide indexiert werden — Netlify leitet
# automatisch auf die Primary Domain um, sobald die Domain dort gesetzt ist.
# Unbekannte Adressen beantwortet Netlify von selbst mit 404.html.
