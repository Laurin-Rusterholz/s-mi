[build]
  publish = "."
  command = "node scripts/build.mjs"

# Serverseitige Endpunkte: /api/booking, /api/order, /api/stripe-webhook.
# Sie nehmen die Formulare entgegen, legen sie im Eingang ab und schicken die
# E-Mail an info@samsparking.ch. Ohne sie waeren die Formulare Attrappen.
# Die Adressen stehen als `config.path` in den Dateien selbst.
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[build.environment]
  NODE_VERSION = "22"

# Bild-CDN: Firebase-Storage-Bilder duerfen ueber /.netlify/images verkleinert
# und als WebP/AVIF ausgeliefert werden (der Generator schreibt diese Adressen).
[images]
  remote_images = ['https://firebasestorage\.googleapis\.com/.*']
  # Inhaltsquelle: Verwaltung (Firebase Realtime Database, öffentlich lesbarer
  # content-Knoten). Ist die API nicht erreichbar, fällt der Build auf den im
  # Repo eingecheckten Stand content/site.json zurück.
  CONTENT_API_URL = "https://jupidu-36804-default-rtdb.europe-west1.firebasedatabase.app/samsparking/content.json"

[[headers]]
  for = "/*"
  [headers.values]
    # Kein X-Frame-Options: das kennt nur DENY/SAMEORIGIN und koennte die
    # Vorschau in der Verwaltung nicht erlauben. frame-ancestors ist der
    # Nachfolger und laesst gezielt nur die eigene Verwaltung (Netlify) zu —
    # fuer alle anderen Seiten bleibt das Einbetten verboten (Clickjacking).
    Content-Security-Policy = "frame-ancestors 'self' https://*.netlify.app https://*.netlify.com http://localhost:* http://127.0.0.1:*"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# CSS/JS werden bei Änderungen überschrieben (gleicher Dateiname) — daher kein
# langes Caching, sonst hängt eine alte Version im Browser/CDN.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Schriften aendern sich nie — ein Jahr cachen.
[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/media/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/presskit/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# ===========================================================================
# LIVE — die ganze Website ist oeffentlich.
#
# Bis zum Launch war das eine Teilwartung: /booking/ und /shop/ waren offen,
# die Startseiten je Sprache lieferten "Coming soon" mit 503. Diese Sperre ist
# aufgehoben; / , /de/ und /fr/ zeigen ihren echten Inhalt mit 200.
#
# Netlify nimmt die ERSTE passende Regel. Die Reihenfolge unten ist deshalb
# keine Geschmacksfrage:
#
#   1. robots.txt und sitemap.xml — muessen mit 200 antworten. Eine robots.txt,
#      die laenger 5xx liefert, wertet Google als "alles gesperrt".
#   2. /api/* — die Endpunkte. Der Stripe-Webhook darf nie ausfallen (Stripe
#      gibt nach einigen Tagen auf, die Zahlung waere dann nirgends vermerkt).
#   3. Alles Weitere faellt durch und wird normal ausgeliefert: die Startseiten,
#      /booking/, /shop/, /videos/, das Impressum, Bilder, CSS.
#
# WIEDER SCHLIESSEN: unter Punkt 3 die sechs Startseiten-Regeln zuruecksetzen
# (Vorlage steht dort im Kommentar). Status 503 statt 404 sorgt dafuer, dass
# Suchmaschinen die Startseite im Index behalten und wiederkommen.
[[redirects]]
  from = "/robots.txt"
  to = "/robots.txt"
  status = 200
[[redirects]]
  from = "/sitemap.xml"
  to = "/sitemap.xml"
  status = 200

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200
  force = true

# --- Punkt 3: die Startseiten-Sperre ist AUFGEHOBEN (Launch) ---------------
# Bis zum Launch standen hier sechs Regeln, die /, /index.html, /de/,
# /de/index.html, /fr/ und /fr/index.html mit 503 auf coming-soon.html
# umgeleitet haben. Sie sind entfernt: die Website ist vollstaendig oeffentlich,
# die Startseiten liefern ihren echten Inhalt mit 200.
#
# WIEDER SCHLIESSEN: hier je Sprache eine Regel setzen —
#   [[redirects]]
#     from = "/"            (und "/index.html", "/de/", "/de/index.html",
#     to = "/coming-soon.html"   "/fr/", "/fr/index.html")
#     status = 503
#     force = true
# Die Datei coming-soon.html bleibt dafuer im Repo und wird weiter gebaut.
# ---------------------------------------------------------------------------

# Retry-After gab es hier fuer coming-soon.html, solange die Startseiten mit 503
# gesperrt waren. Ohne Sperre ist der Hinweis gegenstandslos und darum weg.
# ===========================================================================

# Quelldateien des Generators nicht ausliefern.
# force = true ist hier noetig und war es immer: ohne das Kennzeichen wendet
# Netlify eine Weiterleitung nur an, wenn KEINE Datei auf die Adresse passt —
# und /scripts/build.mjs liegt als Datei da (publish = "."). Die Regel war
# damit wirkungslos, der Quelltext des Generators oeffentlich herunterladbar.
[[redirects]]
  from = "/scripts/*"
  to = "/404.html"
  status = 404
  force = true

# Die Datei hiess frueher "sparkling" (Schreibfehler im Namen) — alte Links
# auf den richtig geschriebenen Namen weiterleiten.
[[redirects]]
  from = "/presskit/sam-sparkling-presskit-2026.pdf"
  to = "/presskit/sam-sparking-presskit-2026.pdf"
  status = 301

# Der Inhalts-Schnappschuss ist eine Bau-Zutat, keine Seite. Auch hier
# force = true, aus demselben Grund wie oben.
[[redirects]]
  from = "/content/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301

# Hauptsprache ist neu Englisch: fruehere deutsche Adressen zeigen auf /de/,
# die alten /en/-Adressen auf die Startseite.
[[redirects]]
  from = "/en/*"
  to = "/:splat"
  status = 301
[[redirects]]
  from = "/rechtliches/*"
  to = "/de/rechtliches/"
  status = 301
[[redirects]]
  from = "/fr/rechtliches/*"
  to = "/fr/mentions-legales/"
  status = 301

# Booking und Shop haben seit August 2026 eigene Seiten (/booking/, /shop/).
# Die frueheren Regeln "/booking/* → /#booking" duerfen deshalb NICHT mehr
# dastehen: sie haben genau die Adresse abgefangen, die es jetzt wirklich gibt,
# und die neue Seite waere nie erreichbar gewesen.
#
# Die uebrigen Abschnitte sind weiterhin Anker auf der Startseite — dafuer
# bleiben die alten Adressen umgelenkt.
[[redirects]]
  from = "/shows/*"
  to = "/#shows"
  status = 301
[[redirects]]
  from = "/gallery/*"
  to = "/#gallery"
  status = 301
[[redirects]]
  from = "/en/shows/*"
  to = "/en/#shows"
  status = 301
[[redirects]]
  from = "/en/gallery/*"
  to = "/en/#gallery"
  status = 301
[[redirects]]
  from = "/fr/shows/*"
  to = "/fr/#shows"
  status = 301
[[redirects]]
  from = "/fr/gallery/*"
  to = "/fr/#gallery"
  status = 301

# Der Shop hatte bis zum 12.08.2026 eine eigene Seite. Er steht jetzt auf der
# Startseite unter der Galerie — alte Links, Lesezeichen und Suchtreffer landen
# per 301 an der richtigen Stelle statt auf 404.
[[redirects]]
  from = "/shop/*"
  to = "/#shop"
  status = 301
[[redirects]]
  from = "/de/shop/*"
  to = "/de/#shop"
  status = 301
[[redirects]]
  from = "/en/shop/*"
  to = "/en/#shop"
  status = 301
[[redirects]]
  from = "/fr/shop/*"
  to = "/fr/#shop"
  status = 301

# Ohne www und mit www duerfen nicht beide indexiert werden — Netlify leitet
# automatisch auf die Primary Domain um, sobald die Domain dort gesetzt ist.
# Unbekannte Adressen beantwortet Netlify von selbst mit 404.html.
