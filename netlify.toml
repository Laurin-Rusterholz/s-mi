[build]
  publish = "."
  command = "node scripts/build.mjs"

[build.environment]
  NODE_VERSION = "22"
  # Inhaltsquelle: Verwaltung (Firebase Realtime Database, öffentlich lesbarer
  # content-Knoten). Ist die API nicht erreichbar, fällt der Build auf den im
  # Repo eingecheckten Stand content/site.json zurück.
  CONTENT_API_URL = "https://jupidu-36804-default-rtdb.europe-west1.firebasedatabase.app/samsparking/content.json"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# CSS/JS werden bei Änderungen überschrieben (gleicher Dateiname) — daher kein
# langes Caching, sonst hängt eine alte Version im Browser/CDN.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Quelldateien des Generators nicht ausliefern.
[[redirects]]
  from = "/scripts/*"
  to = "/404.html"
  status = 404
