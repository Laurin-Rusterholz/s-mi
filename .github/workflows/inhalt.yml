# Holt den Stand aus der Verwaltung (Realtime Database) und checkt die neu
# gebaute Website ein — der Push loest den Netlify-Deploy aus. Damit wirkt
# "Publizieren" in der Verwaltung auch OHNE hinterlegten Netlify-Build-Hook.
#
# Seit dem 12.08.2026 laeuft das alle fuenf Minuten statt stuendlich: eine
# Stunde Wartezeit war der Grund, warum eine Aenderung in der Verwaltung
# gefuehlt "nicht publiziert" wurde. Fuenf Minuten ist das kuerzeste Intervall,
# das GitHub fuer Zeitplaene erlaubt (und es kann sich unter Last verzoegern).
#
# Das kostet nichts Zusaetzliches: ist der Stand unveraendert, endet der Lauf
# nach wenigen Sekunden ohne Commit, und Netlify baut nichts. Nur ein wirklich
# neuer Stand loest einen Deploy aus.
#
# Der schnelle Weg bleibt der Build-Hook: die Verwaltung ruft ihn beim
# Publizieren sofort auf, dann ist der Stand nach dem Netlify-Build (rund eine
# Minute) live. Dieser Zeitplan ist das Netz darunter.
name: Inhalt aus der Verwaltung uebernehmen

on:
  schedule:
    - cron: "*/5 * * * *"   # alle fuenf Minuten (GitHub-Minimum)
  workflow_dispatch: {}     # von Hand: Actions -> Run workflow

permissions:
  contents: write

concurrency:
  group: inhalt-sync
  cancel-in-progress: false

jobs:
  uebernehmen:
    runs-on: ubuntu-latest
    env:
      CONTENT_API_URL: https://jupidu-36804-default-rtdb.europe-west1.firebasedatabase.app/samsparking/content.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Website aus dem Datenbank-Stand bauen
        run: node scripts/build.mjs

      - name: Hero-Video verkleinern (einmal pro hochgeladenem Video)
        # Die Originale aus der Verwaltung sind oft 15+ Mbit/s — auf Mobilfunk
        # kommt der Puffer nie hinterher und das Video steht. ffmpeg rechnet
        # eine schlanke H.264-Fassung (~3.8 Mbit/s, stumm, faststart); der
        # Website-Build setzt sie ein, solange der Quelle-Marker passt.
        continue-on-error: true
        run: |
          SRC=$(node -e "const c=require('./content/site.json');const m=c.hero&&c.hero.media;if(m&&m.type==='video'&&/^https?:/.test(m.src||''))console.log(m.src)")
          if [ -z "$SRC" ]; then echo "Kein externes Hero-Video."; exit 0; fi
          KNOWN=$(cat media/hero-video.source 2>/dev/null || true)
          if [ "$SRC" = "$KNOWN" ]; then echo "Schon optimiert."; exit 0; fi
          echo "Neues Hero-Video gefunden — verkleinern..."
          mkdir -p media
          curl -sSL --max-time 600 -o /tmp/hero-orig.mp4 "$SRC"
          ffmpeg -hide_banner -loglevel error -y -i /tmp/hero-orig.mp4 \
            -vf "scale=-2:1080" -c:v libx264 -preset veryfast -crf 26 \
            -maxrate 3800k -bufsize 7600k -an -movflags +faststart \
            -pix_fmt yuv420p media/hero-video.mp4
          printf '%s' "$SRC" > media/hero-video.source
          ls -la media/
          node scripts/build.mjs
      - name: Aenderungen einchecken (loest den Netlify-Deploy aus)
        run: |
          git config user.name "verwaltung"
          git config user.email "contact@laurin-rusterholz.ch"
          git add -A
          if git diff --cached --quiet; then
            echo "Kein neuer Inhalt — nichts zu tun."
            exit 0
          fi
          git commit -m "Inhalt aus der Verwaltung uebernommen"
          git push
      - name: Bild-Cache am Netz-Rand vorwaermen
        # Das erste Laden eines Bildes ueber /.netlify/images verkleinert es
        # erst — dieser Schritt ruft alle Bild-Adressen einmal ab, damit
        # Besucher immer den warmen Cache treffen. Schlaegt nie den Build fehl.
        if: always()
        continue-on-error: true
        run: |
          BASE="https://djsamsparkling.netlify.app"
          sleep 120   # dem Netlify-Deploy einen Moment Vorsprung lassen
          for path in / /en/ /fr/; do
            curl -s --max-time 20 "$BASE$path" \
              | grep -o '/\.netlify/images[^"]*' | sed 's/&amp;/\&/g' | sort -u | head -60 \
              | while read -r u; do
                  curl -s -o /dev/null --max-time 30 -H "Accept: image/avif,image/webp,image/*" "$BASE$u" || true
                done
          done
